name: build-zcode-cli-linux-x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Pin pnpm 10.33.2
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install deps (v3.17.1 lockfile 滞后，禁用 frozen)
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI + shared + official plugins
        run: |
          pnpm --filter @zcode/cli... build
          # @zcode/shared 无 build 脚本，SEA 需要其 dist
          pnpm --filter @zcode/shared exec tsc -p tsconfig.json
          # SEA 内置的 requiresRuntime 官方插件，都需要先 build
          pnpm --filter @zcode/node-repl-host build
          pnpm --filter @zcode/android-emulator-plugin build
          pnpm --filter @zcode/ios-simulator-plugin build
          pnpm --filter @zcode/documents-plugin build
          pnpm --filter @zcode/pdf-plugin build
          pnpm --filter @zcode/presentations-plugin build
          pnpm --filter @zcode/spreadsheets-plugin build
          pnpm --filter @zcode/browser-use-plugin build
          pnpm --filter @zcode/zcode-site-plugin build



      - name: Build SEA single-file binary
        run: pnpm --filter @zcode/cli sea --target linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-x64
          path: apps/zcode-cli/packages/cli/dist/zcode-linux-x64
